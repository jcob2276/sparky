name: Inspect public KNF report index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify official discovery contract
        run: python scripts/tests/test_gpw_oam.py
      - name: Discover consolidated annual reports from official KNF
        run: |
          python - <<'PY'
          import sys, json, io, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          sys.path.insert(0, 'scripts/ops')
          from gpw_oam import discover_annual, resolve_package
          from gpw_esef import parse_package
          def fetch(url):
              with urlopen(Request(url, headers={'User-Agent': 'Sparky financial report importer'}), timeout=30) as response:
                  raw=response.read(50_000_001)
                  if len(raw)>50_000_000:
                      raise ValueError('Oversized official response')
                  return raw
          reports=discover_annual(lambda url: fetch(url).decode('utf8'), 'XTB', 'XTB SPÓŁKA AKCYJNA')
          print(json.dumps({'annualReports': reports}, ensure_ascii=False))
          if not reports:
              raise ValueError('No annual reports discovered')
          raw=fetch(reports[0]['source_url'])
          if not raw.startswith(b'PK'):
              download=resolve_package(raw, reports[0]['source_url'])
              print(json.dumps({'officialPackage': download}))
              raw=fetch(download)
          if raw.startswith(b'PK'):
              Path('/tmp/oam-package.zip').write_bytes(raw)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  print(json.dumps({'packageMembers': [{'name': m.filename, 'bytes': m.file_size} for m in archive.infolist()]}))
              try:
                  print(json.dumps({'financialReports': parse_package(raw, '259400AVUPSABLEXNT19')}, ensure_ascii=False))
              except ValueError as error:
                  print(json.dumps({'packageFormat': str(error)}))
          else:
              Path('/tmp/oam-package.html').write_bytes(raw)
              print(json.dumps({'packageResponseBytes': len(raw), 'packagePrefix': raw[:150].decode('utf8', errors='replace')}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-oam-package
          path: /tmp/oam-package.*
          retention-days: 1
          if-no-files-found: ignore
