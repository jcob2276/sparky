name: House disclosure OCR recovery
on:
  workflow_dispatch:
    inputs:
      document_id:
        description: Optional existing House document ID to retry immediately
        default: ''
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: read
concurrency:
  group: house-disclosure-ocr
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
          python -m pip install 'Pillow==12.3.0' 'numpy==2.3.5'
      - name: Verify paper form safeguards
        run: python scripts/tests/test_house_paper_ocr.py
      - name: Verify native OCR against an official paper disclosure
        run: |
          curl --fail --silent --show-error --location https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/9116342.pdf --output /tmp/house-reference.pdf
          python scripts/ops/house-paper-ocr.py /tmp/house-reference.pdf --disclosure-date 2026-09-23 > /tmp/house-reference.json
          python - <<'PY'
          import json
          with open('/tmp/house-reference.json') as source:
              rows = json.load(source)
          assert len(rows) == 1, rows
          row = rows[0]
          assert row['type'] == 'sell' and row['ticker'] is None, row
          assert row['transactionDate'] == '2026-08-05', row
          assert row['notificationDate'] == '2026-09-22', row
          assert (row['amountLow'], row['amountHigh']) == (1001, 15000), row
          assert row['asset'] == 'Redeemed Electronic Arts', row
          PY
      - name: Verify the modern form and its continuation page
        run: |
          curl --fail --silent --show-error --location https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/9116331.pdf --output /tmp/house-modern.pdf
          python scripts/ops/house-paper-ocr.py /tmp/house-modern.pdf --disclosure-date 2026-09-11 > /tmp/house-modern.json
          python - <<'PY'
          import json
          with open('/tmp/house-modern.json') as source:
              rows = json.load(source)
          assert len(rows) == 5, rows
          assert [row['type'] for row in rows] == ['sell','buy','buy','sell','buy'], rows
          assert [row['transactionDate'] for row in rows] == ['2026-07-30','2026-07-30','2026-08-06','2026-07-30','2026-07-30'], rows
          assert all(row['notificationDate'] == '2026-08-19' for row in rows), rows
          assert all(row['amountLow'] == 15001 and row['amountHigh'] == 50000 for row in rows), rows
          assert all(row['ticker'] is None for row in rows), rows
          PY
      - name: Verify tall table headers on a recent official form
        run: |
          curl --fail --silent --show-error --location https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/9116361.pdf --output /tmp/house-tall-header.pdf
          python scripts/ops/house-paper-ocr.py /tmp/house-tall-header.pdf --disclosure-date 2026-10-02 > /tmp/house-tall-header.json
          python - <<'PY'
          import json
          with open('/tmp/house-tall-header.json') as source:
              rows = json.load(source)
          assert len(rows) == 4, rows
          assert all(row['type'] == 'sell' and row['owner'] == 'joint' and row['ticker'] is None for row in rows), rows
          assert all(row['transactionDate'] == '2026-09-17' and row['notificationDate'] == '2026-10-02' for row in rows), rows
          assert [(row['amountLow'],row['amountHigh']) for row in rows] == [(50001,100000),(15001,50000),(15001,50000),(15001,50000)], rows
          assert rows[0]['asset'].startswith('SERVICENOW'), rows
          assert rows[1]['asset'].startswith('THE TRADE DESK'), rows
          PY
      - name: Recover official scanned disclosures
        env:
          SUPABASE_URL: ${{ secrets.HOUSE_OCR_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HOUSE_OCR_SUPABASE_KEY }}
          HOUSE_OCR_DOCUMENT_ID: ${{ inputs.document_id || '' }}
        run: |
          if [ -n "$HOUSE_OCR_DOCUMENT_ID" ]; then
            python scripts/ops/sync-house-ocr.py --document-id "$HOUSE_OCR_DOCUMENT_ID"
          else
            python scripts/ops/sync-house-ocr.py
          fi
